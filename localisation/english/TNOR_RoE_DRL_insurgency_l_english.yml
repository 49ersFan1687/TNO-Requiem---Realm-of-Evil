l_english:
 DRL_national_insurgency_category: "National Insurgency"
 DRL_national_insurgency_category_desc: "West Russia is conquered, but it is nowhere near subdued."
 DRL_NATIONAL_INSURGENCY_OPEN_TT: "§YOpen the National Pacification Directorate§!\n\nHerr Dirlewanger, the latest field reports from the conquered western territories await your attention. Your officers require fresh orders, ammunition and authority before the next sweep can begin."
 DRL_NATIONAL_INSURGENCY_TITLE: "THE REALM'S INSURGENCY"
 DRL_NATIONAL_INSURGENCY_VALUE: "NATIONAL INSURGENCY: §R[?DRL_national_insurgency|0]§! / 100"
 DRL_NATIONAL_INSURGENCY_BAR: "[GetDRLInsurgencyBar]"
 DRL_NATIONAL_INSURGENCY_DEADLINE: "§YHerr Dirlewanger: insurgency must stand at 40 or lower by 1 January 1968.§!\n§RIf we fail you, the entire Realm may rise against us.§!\nMonthly spread risk: §Y50%§! chance of §R+1 to +5§! insurgency. Last month: §R+[?DRL_last_monthly_insurgency_growth|0]§!."
 DRL_NATIONAL_INSURGENCY_DESC: "§YTo Herr Oskar Dirlewanger, Commander of the Realm.§!\n\nConquest has not produced obedience. Every forest conceals deserters, every rail depot shelters saboteurs, and every former capital breeds another would-be liberator. The defeated warlords remain divided for now. Strike each nest in turn and they can be butchered separately; hesitate, and they may discover that together they are a nation.\n\n§g—Consolidated report of the Security Staff§!"
 DRL_NATIONAL_INSURGENCY_INFO_TT: "§YCONFIDENTIAL — FOR THE COMMANDER'S EYES§!\n\nHerr Dirlewanger, captured correspondence confirms that surviving officers from the western warlord regimes are exchanging couriers, forged travel papers, medicine and stolen weapons. Railwaymen hide fugitives in freight wagons. Priests pass names between villages. Former policemen deliberately misfile arrest records. Even officials who swear loyalty to the Realm often warn their relatives before our columns arrive.\n\nThe Directorate recommends a sequence of isolated, overwhelming sweeps. Each field group will surround settlements before dawn, sever roads and telephones, interrogate local notables, seize military-age suspects and destroy any food or shelter useful to the bands. The political offices must suppress complaints while Army command diverts transport and ammunition.\n\nWe cannot operate everywhere simultaneously. A premature second deployment would advertise our intentions, exhaust the motor pool and leave both columns undersupplied. Select the sectors personally, Herr Dirlewanger, and we will provide you with names when the work is finished."
 DRL_NATIONAL_INSURGENCY_OPERATIONS: "DIRECTORATE OF PACIFICATION"
 DRL_OPERATION_VYT: "§YVyatka Prefecture§!\n§YBoris Smyslovsky§!\n\n\n\n\n\n\n£GFX_DRL_insurgency_boris_smyslovsky_vyatka\n\n\n\n\n\n\n\n\nHerr Dirlewanger, authorize the destruction of the surviving Tsarist circles."
 DRL_OPERATION_KOM: "§YKomi Prefecture§!\n§YIvan Serov§!\n\n\n\n\n\n\n£GFX_DRL_insurgency_ivan_serov_komi\n\n\n\n\n\n\n\n\nHerr Dirlewanger, authorize a sweep against Serov's scattered soldiers and political officers."
 DRL_OPERATION_SAM: "§YSamara Sector§!\nHerr Dirlewanger, authorize the final pursuit of the Liberation Army."
 DRL_OPERATION_ONG: "§YOnega Prefecture§!\n§YNikolai Omelin§!\n\n\n\n\n\n\n£GFX_DRL_insurgency_nikolai_omelin_onega\n\n\n\n\n\n\n\n\nHerr Dirlewanger, authorize our northern battalions to burn the forest camps."
 DRL_OPERATION_NEN: "§YNenets Prefecture§!\n§YAnastasia Lapsui§!\n\n\n\n\n\n\n£GFX_DRL_insurgency_anastasia_lapsui_nenets\n\n\n\n\n\n\n\n\nHerr Dirlewanger, authorize a winter sweep against the Arctic holdouts and smugglers."
 DRL_OPERATION_VOL: "§YVologda Sector§!\nHerr Dirlewanger, authorize arrests and reprisals against the urban resistance cells."
 DRL_OPERATION_GAY: "§YBashkir Sector§!\nHerr Dirlewanger, authorize the cavalry columns to break the mountain resistance."
 DRL_OPERATION_PRM: "§GPerm Prefecture - Loyal§!\n§YEvgeny Golovin§!\n\n\n\n\n\n\n£GFX_DRL_insurgency_evgeny_golovin_perm\n\n\n\n\n\n\n\n\nGolovin and the Perm garrison remain firmly obedient to Dirlewanger. No pacification operation is required here."
 DRL_OPERATION_TAR: "§YSyzran Sector§!\nHerr Dirlewanger, authorize a river sweep against the Idel-Ural bands."
 DRL_OPERATION_ORSK_LOYAL: "§GOrsk Prefecture - Loyal§!\n§YKallistros Thielecke§!\n\n\n\n\n\n\n£GFX_DRL_insurgency_kallistros_thielecke_orsk\n\n\n\n\n\n\n\n\nThe Realm's heartland remains firmly under Dirlewanger's authority. Thielecke and his garrison answer directly to the Bandit King; no pacification operation is required here."
 DRL_OPERATION_LIST_LEFT: "§YONEGA§!\nSweep the northern holdouts\n\n§YNENETS§!\nPurge the Arctic holdouts\n\n§YKOMI§!\nBreak Serov's army\n\n§YVOLOGDA§!\nPurge the resistance cells\n\n§YVYATKA§!\nCrush the Tsarists\n\n§GPERM - LOYAL§!\nEvgeny Golovin, Prefect"
 DRL_OPERATION_LIST_RIGHT: "§YSYZRAN§!\nShatter the Idel-Ural bands\n\n§YSAMARA§!\nDestroy the Liberation Army\n\n§YBASHKIRIA§!\nCrush the resistance\n\n§GORSK - LOYAL§!\nKallistros Thielecke, Prefect"
 DRL_OPERATION_TOOLTIP: "§YFIELD AUTHORIZATION REQUIRED§!\n£political_power_texticon §Y25§!   £command_power §Y5§!   £weapon_icon §Y250§!\n\nThe assigned battalions will require §Y30 days§! to isolate villages, interrogate prisoners, destroy supply caches and report the sector secure. Only one major sweep can be supplied at a time.\n\nUpon completion: National Insurgency §G-5§!.\n\n§gThe men await your signature, Herr Dirlewanger.§!"
 DRL_NATIONAL_INSURGENCY_FOOTER: "§gHerr Dirlewanger, each sector can be subjected to one decisive sweep. The Directorate cannot conceal the movement of two field groups at once; until the deployed column returns, every other plan must remain on your desk.§!"
 DRL_INSURGENCY_LEDGER_TITLE: "FIELD OPERATIONS LEDGER"
 DRL_INSURGENCY_OPERATION_STATUS: "[GetDRLInsurgencyOperationStatus]"
 DRL_INSURGENCY_STATUS_RUNNING: "§YDEPLOYED COLUMN REPORTS IN: [?DRL_insurgency_operation_days_left|0] DAYS§!"
 DRL_INSURGENCY_STATUS_READY: "§GSTAFF READY — AWAITING YOUR ORDER§!"
 DRL_INSURGENCY_STATUS_BLOCKED: "§RSTAFF BLOCKED — AUTHORITY OR SUPPLIES INSUFFICIENT§!"
 DRL_INSURGENCY_OPERATION_COSTS: "NEXT AUTHORIZATION:  £political_power_texticon §Y25§!   £command_power §Y5§!   £weapon_icon §Y250 rifles§!\nOPERATIONAL INTERVAL: §Y30 days§!"
 DRL_INSURGENCY_FIELD_REPORT: "§gHerr Dirlewanger, transport officers confirm that one reinforced column can be maintained in the field. Rifles will be issued without expectation of return. Political authority is required to silence civilian objections. Every month of delay gives the underground another chance to recruit, arm itself and spread.§!"
 DRL_insurgency.10.t: "The Realm Endures"
 DRL_insurgency.10.desc: "Herr Dirlewanger, the final consolidated reports have arrived. Our columns have crossed every road marked in red, the prisons are full, and the surviving warlord staffs no longer possess the men or weapons required to coordinate a national rising. Resistance has not vanished—nothing in Russia ever vanishes cleanly—but it has been reduced to frightened families, isolated fugitives and petty bandits who can be hunted at leisure.\n\nThe officers of the Directorate congratulate you. West Russia has learned that the Realm does not forget an insult and does not tire of punishment."
 DRL_insurgency.10.a: "Tell the henchmen they have served me well."
 DRL_insurgency.11.t: "The Realm Collapses"
 DRL_insurgency.11.desc: "Herr Dirlewanger, we have failed you. Couriers captured outside Vyatka carried orders bearing the seals of men we reported dead. Railway guards have deserted, police stations have opened their arsenals to the crowds, and old warlord banners are appearing from Onega to Orsk. Our reprisals now create rebels faster than the field groups can kill them.\n\nSeveral district commanders no longer answer the radio. Others answer only to demand reinforcements that do not exist. Beyond the immediate range of the Brigade's guns, the Realm is already spoken of in the past tense."
 DRL_insurgency.11.a: "Find whoever wrote this report. Now."
