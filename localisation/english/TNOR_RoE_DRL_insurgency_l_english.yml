l_english:
 DRL_national_insurgency_category: "National Insurgency"
 DRL_national_insurgency_category_desc: "West Russia is conquered, but it is nowhere near subdued."
 DRL_NATIONAL_INSURGENCY_TITLE: "THE REALM'S INSURGENCY"
 DRL_NATIONAL_INSURGENCY_VALUE: "National Insurgency: §R[?DRL_national_insurgency|0]§!"
 DRL_NATIONAL_INSURGENCY_DEADLINE: "§YBy 1 January 1968, National Insurgency must be 40 or lower.§!\n§RFailure will collapse the Realm.§!"
 DRL_NATIONAL_INSURGENCY_DESC: "Our triumph over West Russia has left enemies in every forest, village and ruined city. Former warlords and local leaders are gathering the discontented into armed bands. If they are not broken one by one, their scattered resistance will become a national revolt."
 DRL_NATIONAL_INSURGENCY_OPERATIONS: "PACIFICATION OPERATIONS"
 DRL_OPERATION_VYT: "Crush the Vyatkan Tsarists"
 DRL_OPERATION_KOM: "Break Serov's Army"
 DRL_OPERATION_SAM: "Destroy the Liberation Army"
 DRL_OPERATION_ONG: "Sweep the Onega Holdouts"
 DRL_OPERATION_VOL: "Purge the Vologdan Cells"
 DRL_OPERATION_GAY: "Crush the Bashkir Resistance"
 DRL_OPERATION_PRM: "Subdue the Perm Remnants"
 DRL_OPERATION_TAR: "Shatter the Idel-Ural Bands"
 DRL_OPERATION_ORSK: "Purge the Orsk Conspirators"
 DRL_OPERATION_TOOLTIP: "The operation takes §Y30 days§!. Only one operation may be underway at a time.\nWhen completed: National Insurgency: §G-5§!"
 DRL_NATIONAL_INSURGENCY_FOOTER: "Each operation can be launched only once. While an operation is underway, all other operations are locked."
 DRL_insurgency.10.t: "The Realm Endures"
 DRL_insurgency.10.desc: "By raid, reprisal and relentless pursuit, the last warlord armies have been deprived of the strength needed to unite West Russia against us. Resistance remains, but it can no longer destroy the Realm."
 DRL_insurgency.10.a: "There is no power but ours."
 DRL_insurgency.11.t: "The Realm Collapses"
 DRL_insurgency.11.desc: "The scattered enemies of the Brigade have found one another. Across West Russia, old banners rise again as garrisons desert, supply columns vanish and entire cities revolt. The Realm has ceased to exist beyond the reach of its guns."
 DRL_insurgency.11.a: "Our Realm shall be no more..."
